name: PR

# Everything here runs on a plain ubuntu runner with no device and no browser
# download. The rule this encodes: a unit or parsing bug has to fail here, before
# it is allowed to reach the device suite.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-keys:
    name: Generated StyleKeys are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies needed: the generator is plain Node.
      - run: node tools/scripts/style-keys/generate.mjs --check

  ts-unit:
    name: TypeScript CSS value layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec ts-patch install
      - run: pnpm test --maxWorkers=2
      - name: JSX intrinsics match the element registry
        run: pnpm test:jsx-types
      - name: Typecheck the plugin
        run: pnpm exec tsc -p packages/nativescript-masonkit/tsconfig.json --noEmit

  rust:
    name: mason-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p mason-core --all-targets
