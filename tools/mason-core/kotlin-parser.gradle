repositories { mavenCentral() }
configurations { masonCoreParser }
dependencies { masonCoreParser 'org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.20' }

tasks.register('resolveMasonCoreParser') {
  doLast {
    // Resolve artifacts, not just their metadata, before the source parser runs.
    configurations.masonCoreParser.files.each { file ->
      if (!file.isFile()) throw new GradleException("Missing Kotlin compiler artifact: $file")
    }
  }
}
